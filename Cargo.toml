[workspace]
members = [
  "crates/tiber-app-server",
  "crates/tiber-cli",
  "crates/tiber-external-tools-core",
  "crates/tiber-rmcp-client",
  "crates/tiber-review",
  "crates/tiber-store-git",
  "crates/tiber-tasks-core",
  "crates/tiber-tasks-service",
  "crates/tiber-tui",
  "crates/tiber-workflow-core",
  "crates/tiber-workflow-service",
]
exclude = ["old-code-for-reference"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
eventcore = { version = "=2.0.0", features = ["experimental-modeling"] }
eventcore-types = "=2.0.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.143"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
blanket_clippy_restriction_lints = "allow"
