[package]
name = "tiber"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Authoritative Rust engine for the Pi-native Tiber development system"
repository = "https://github.com/jwilger/tiber"
readme = "README.md"
keywords = ["pi", "development", "workflow"]
categories = ["development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md"]

[[bin]]
name = "tiber"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
