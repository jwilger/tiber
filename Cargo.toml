[workspace]
members = [
  "crates/tiber-cli",
  "crates/tiber-external-tools-core",
  "crates/tiber-hindsight-http",
  "crates/tiber-integration-audit",
  "crates/tiber-memory-core",
  "crates/tiber-process-core",
  "crates/tiber-process-linux",
  "crates/tiber-process-service",
  "crates/tiber-rmcp-client",
  "crates/tiber-repository-core",
  "crates/tiber-repository-service",
  "crates/tiber-repository-linux",
  "crates/tiber-review",
  "crates/tiber-session-service",
  "crates/tiber-store-git",
  "crates/tiber-tasks-core",
  "crates/tiber-tasks-service",
  "crates/tiber-tui",
  "crates/tiber-workflow-core",
  "crates/tiber-workflow-service",
]
exclude = ["old-code-for-reference"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
eventcore = { version = "=2.0.1", features = ["experimental-modeling"] }
eventcore-fs = "=2.0.1"
eventcore-types = "=2.0.1"
eventcore-memory = "=2.0.1"
futures = "=0.3.32"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "=0.28.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
rustix = { version = "=1.1.4", features = ["process"] }
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
blanket_clippy_restriction_lints = "allow"
expect_used = "allow"
implicit_return = "allow"
question_mark_used = "allow"

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
