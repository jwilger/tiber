# Tiber standalone coding harness commit gate.
assert_lefthook_installed: true

pre-commit:
  commands:
    tiber-format:
      run: nix develop -c cargo fmt --all --check
    tiber-clippy:
      run: nix develop -c cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
    tiber-unit-tests:
      run: nix develop -c cargo test --locked --workspace --all-features --lib --bins
