[package]
name = "tiber-rmcp-client"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bytes = "=1.12.1"
futures = "=0.3.32"
http = "=1.4.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"] }
rmcp = { version = "=3.0.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json.workspace = true
sse-stream = "=0.2.5"
tiber-external-tools-core = { path = "../tiber-external-tools-core" }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.18", default-features = false, features = ["rt"] }
tracing = "=0.1.44"

[dev-dependencies]
tiber-integration-audit = { path = "../tiber-integration-audit" }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
