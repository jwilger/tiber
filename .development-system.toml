schema_version = 3

[delivery]
mode = "direct-to-trunk"
trunk_branch = "main"

[features]
agentic_systems = true
eval_case_reporting = false
tiber = false

[final_review.models.codex]
pre_filter = "gpt-5.6-sol"
lens_review = "gpt-5.6-terra"
post_filter = "gpt-5.6-luna"
verifier = "gpt-5.6-sol"

[scopes.source]
category = "source"
include = ["crates/*/src/**", "config/**"]

[scopes.tests]
category = "tests"
include = ["crates/*/tests/**", "scripts/tests/**"]

[scopes.documentation]
category = "documentation"
include = [
    "*.md",
    "docs/**",
    "SPIKES/**",
    "third_party/**",
    "LICENSE",
    "NOTICE",
]

[scopes.developer_environment]
category = "developer_environment"
include = [
    ".github/**",
    ".gitignore",
    "scripts/**",
    "Cargo.lock",
    "Cargo.toml",
    "flake.lock",
    "flake.nix",
    "justfile",
    "lefthook.yml",
    "crates/*/Cargo.toml",
]
exclude = ["scripts/tests/**"]

[scopes.build_output]
category = "build_output"
include = ["target/**"]
