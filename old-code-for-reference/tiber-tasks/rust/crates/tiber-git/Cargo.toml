[package]
name = "tiber-git"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eventcore = { version = "=2.0.0", features = ["experimental-modeling"] }
eventcore-fs = "=2.0.0"
eventcore-types = "=2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiber-core = { path = "../tiber-core" }
tokio = { version = "1", features = ["rt", "sync"] }
toml = "0.8"
uuid = { version = "1", features = ["serde", "v7"] }
wait-timeout = "0.2"

[lib]
path = "src/lib.rs"

[dev-dependencies]
eventcore = { version = "=2.0.0", features = ["experimental-model-check"] }
eventcore-testing = "=2.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
