name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Deterministic quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enable user namespaces for Bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run required checks
        run: nix develop --accept-flake-config -c just ci

  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    needs: [quality]
    if: always()
    steps:
      - name: Require the quality gate
        run: |
          result="${{ needs.quality.result }}"
          echo "quality result: $result"
          test "$result" = success
