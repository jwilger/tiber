name: Mutation baseline

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Refresh mutation baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Restore mutation baseline
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-main-${{ github.run_id }}
          restore-keys: stryker-main-
      - name: Refresh changed mutation results
        if: github.event_name != 'schedule'
        run: npm run test:mutation
      - name: Rebuild all mutation results
        if: github.event_name == 'schedule'
        run: npm run test:mutation -- --force
