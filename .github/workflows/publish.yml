name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - name: Check out the released revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(node -p \"require('./package.json').version\")"
      - run: npm run verify
      - name: Build the exact publication tarball
        run: npm pack --json > npm-pack.json
      - name: Use an OIDC-capable pinned npm CLI
        run: npm install --global npm@11.5.1
      - name: Publish with provenance
        run: npm publish "$(node -p \"require('./npm-pack.json')[0].filename\")" --access public --provenance
