name: Publish npm package

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      release-tag:
        description: Exact immutable release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release-tag:
        description: Exact existing GitHub Release tag to recover
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
    steps:
      - name: Check out the released revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify the GitHub Release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" = "$(git rev-parse HEAD)"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify release tag and package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - run: npm run verify
      - name: Build the exact publication tarball
        run: npm pack --json > npm-pack.json
      - name: Use an OIDC-capable pinned npm CLI
        run: npm install --global npm@11.5.1
      - name: Publish with provenance
        run: npm publish "$(node -p \"require('./npm-pack.json')[0].filename\")" --access public --provenance
